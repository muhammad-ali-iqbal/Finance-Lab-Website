server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://financelab-api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/blog/(.+)\.html$ {
        return 301 /blog/$1;
    }

    # Deleted/renamed slugs must 404 here, not silently fall through to
    # /index.html: that fallback is an internal rewrite (no redirect), so the
    # browser's URL stays under /blog/, and every relative asset/link on the
    # homepage then resolves one level too deep (assets/, blog/... all break).
    location /blog/ {
        try_files $uri $uri.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
