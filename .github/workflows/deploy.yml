name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /root/financelab-test
            git pull origin main
            docker build -t financelab-test .
            docker stop financelab-test || true
            docker rm financelab-test || true
            docker run -d \
              --name financelab-test \
              --restart unless-stopped \
              --network app_default \
              financelab-test
